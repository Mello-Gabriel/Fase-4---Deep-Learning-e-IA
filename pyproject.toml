[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "fase-4-deep-learning-e-ia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "notebook>=7.5.6",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "scikit-learn>=1.8.0",
    "tensorflow>=2.21.0",
    "uvicorn>=0.47.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.0.260204",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]
extend-exclude = [
    "ESTUDO-TECH-CHALLENGE",
    "REDES NEURAIS E DEEP LEARNING",
    "NLP",
    "GENERATIVE AI",
    "COMPUTATIONAL VISION",
    "REPOSITÓRIO AULAS",
    ".venv",
    "data",
    "models",
    "reports",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "N803",  # argument name (X_train, X_test são convenção em ML)
    "N806",  # local variable name (mesma razão)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "SIM117"]
# Notebooks são exploratórios: liberamos prints e expressões soltas (resultado da célula),
# imports não-no-topo, e variáveis maiúsculas no estilo `X_train`/`X_test`.
"*.ipynb" = ["E402", "E501", "B018", "F401", "F811", "T201", "N806", "N803"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
files = ["src", "api", "tests"]
exclude = [
    "ESTUDO-TECH-CHALLENGE",
    "REDES NEURAIS E DEEP LEARNING",
    "NLP",
    "GENERATIVE AI",
    "COMPUTATIONAL VISION",
    "REPOSITÓRIO AULAS",
    "\\.venv",
    "data",
    "models",
    "reports",
]

[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "yfinance.*",
    "joblib.*",
    "sklearn.*",
    "matplotlib.*",
    "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true
